name: Build and Deploy Voxray

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          #flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # NEW: Decode Keystore natively so Gradle can sign BOTH the APK and AAB automatically
      - name: Decode Android Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks

      - name: Build Android App Bundle (.aab)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PATH: keystore.jks
        run: flutter build appbundle --build-name=1.5.${{ github.run_number }} --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PATH: keystore.jks
        run: flutter build apk --build-name=1.5.${{ github.run_number }} --build-number=${{ github.run_number }} --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always() 
        with:
          tag_name: build-${{ github.run_number }}
          name: "Voxray Build #${{ github.run_number }}"
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Clickable Link
        if: always()
        run: |
          echo "### 📱 Download Your Build Directly" >> $GITHUB_STEP_SUMMARY
          echo "Click here to download your compiled app: [Download Mobile APK](https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY

      # 🟢 FIXED: This APK is now permanently signed by Gradle, so updates won't require uninstalling!
      - name: Send APK to Telegram
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "New Voxray build deployed! Version 1.5.${{ github.run_number }}"
          document: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          #flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies & Generate Configs
        run: |
          flutter clean
          flutter pub get
          flutter precache --ios
          flutter build ios --config-only --no-codesign

      - name: Force CocoaPods for Sentry (Disable SPM)
        run: find ~/.pub-cache/hosted/pub.dev/sentry_flutter* -name "Package.swift" -type f -delete || true

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 🟢 FIXED: Added build-name and build-number variables to match Android perfectly
      - name: Build unsigned iOS App
        run: flutter build ios --release --no-codesign --build-name=1.5.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Package into IPA format
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qq -r voXRay-iOS.ipa Payload

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always() 
        with:
          tag_name: build-${{ github.run_number }}
          prerelease: true
          files: build/ios/iphoneos/voXRay-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Build Windows Portable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          #flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 🟢 NEW: Added Windows build with synced version numbers
      - name: Build Windows
        run: flutter build windows --release --build-name=1.5.${{ github.run_number }} --build-number=${{ github.run_number }}

      # 🟢 NEW: Zips the Windows build into a portable folder for distribution
      - name: Zip Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath voXRay-Windows.zip

      - name: Upload Windows to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always() 
        with:
          tag_name: build-${{ github.run_number }}
          prerelease: true
          files: voXRay-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build_macos:
    name: Build macOS Desktop
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3' # Native Dart 3.7 support for file_saver 0.4.0
          channel: 'stable'
          cache: true

      - name: Generate macOS Platform Files & Overrides
        run: |
          # 1. Clean native overrides for Flutter 3.29 / Dart 3.7
          cat << 'EOF' > pubspec_overrides.yaml
          dependency_overrides:
            win32: 5.5.4
            sentry: 8.13.0
            sentry_flutter: 8.13.0
            flutter_soloud: 3.1.0
            meta: 1.15.0
            file_saver: 0.4.0
            http_parser: 4.0.2
            collection: 1.19.1
          EOF

          # 2. Wipe tracked platform folders to avoid template conflicts
          rm -rf macos android
          
          # 3. Recreate macOS project natively
          flutter create --platforms=macos --no-pub .
          flutter pub get
          
          # 4. FORCE COCOAPODS FOR SENTRY (Bypasses SPM compiler errors)
          find ~/.pub-cache/hosted/pub.dev/sentry_flutter* -name "Package.swift" -type f -delete || true
          
          flutter build macos --config-only || true
          sed -i '' 's/10.14/10.15/g' macos/Podfile
          
          # 5. Inject Architecture Constraints into the Podfile
          python3 -c "
          with open('macos/Podfile', 'r') as f:
              content = f.read()
          
          injection = '''
            target.build_configurations.each do |config|
              config.build_settings['ARCHS'] = 'x86_64'
              config.build_settings['ONLY_ACTIVE_ARCH'] = 'YES'
            end
          '''
          content = content.replace('installer.pods_project.targets.each do |target|', 'installer.pods_project.targets.each do |target|' + injection)
          
          with open('macos/Podfile', 'w') as f:
              f.write(content)
          "

          echo "ARCHS = x86_64" >> macos/Runner/Configs/Release.xcconfig
          echo "ONLY_ACTIVE_ARCH = YES" >> macos/Runner/Configs/Release.xcconfig
          
          cd macos && pod install && cd ..

          # 6. Microphone permissions & DISABLE IMPELLER (Saves the 2012 Intel HD 4000 GPU)
          PLIST_PATH="macos/Runner/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Microphone access is required for audio recording and analysis.'" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :FLTEnableImpeller bool false" "$PLIST_PATH" || true
          fi

          # 7. Sentry C++ patch
          echo "Patching Sentry in CocoaPods..."
          chmod -R +w macos/Pods/Sentry
          python3 -c "
          import glob
          for path in glob.glob('macos/Pods/Sentry/**/*.h', recursive=True) + glob.glob('macos/Pods/Sentry/**/*.cpp', recursive=True) + glob.glob('macos/Pods/Sentry/**/*.hpp', recursive=True):
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              modified = False
              if 'ThreadHandleMetadataPair' in content:
                  new_content = content.replace('const ThreadHandleMetadataPair', 'ThreadHandleMetadataPair')
                  if new_content != content:
                      content = new_content
                      modified = True
                  new_content = content.replace('ThreadHandleMetadataPair &pair', 'const ThreadHandleMetadataPair &pair')
                  if new_content != content:
                      content = new_content
                      modified = True
              if modified:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
          "

      - name: Build macOS App
        env:
          MACOSX_DEPLOYMENT_TARGET: 10.15
        run: flutter build macos --release --build-name=1.5.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Zip macOS Build
        run: |
          cd build/macos/Build/Products/Release
          zip -qq -r ../../../../../voXRay-macOS.zip *.app

      - name: Clean Up Workspace
        if: always()
        run: |
          rm -f pubspec_overrides.yaml
          git reset --hard

      - name: Upload macOS to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: build-${{ github.run_number }}
          prerelease: true
          files: voXRay-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
